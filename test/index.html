<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass — iOS 26</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone" id="phone">

    <div class="wallpaper" id="wallpaper"><span class="wallpaper-inner"></span></div>

    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 20 12" fill="currentColor">
          <rect x="0" y="7" width="3" height="5" rx="1" />
          <rect x="5" y="4" width="3" height="8" rx="1" />
          <rect x="10" y="1" width="3" height="11" rx="1" />
          <rect x="14" y="0" width="6" height="12" rx="2" fill="rgba(255,255,255,0.28)" />
          <rect x="15" y="2" width="4" height="8" rx="1" fill="white" />
        </svg>
        <svg viewBox="0 0 18 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1.5 4.5a10 10 0 0 1 15 0" />
          <path d="M4 7.5a6.5 6.5 0 0 1 10 0" />
          <circle cx="9" cy="10.5" r="1.6" fill="currentColor" stroke="none" />
        </svg>
        <svg viewBox="0 0 27 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <rect x="1" y="1" width="22" height="11" rx="3.5" />
          <path d="M24 4.5v4" />
        </svg>
      </span>
    </div>

    <button class="bg-toggle" id="bgToggle" aria-label="Toggle background">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4" />
        <circle cx="9" cy="9" r="2" />
        <path d="m21 15-3.4-3.4a1 1 0 0 0-1.4 0L9 19" />
        <path d="m15 15-1-1a1 1 0 0 0-1.4 0L5 21" />
      </svg>
      <svg class="flat" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="3" width="18" height="18" rx="4" />
      </svg>
    </button>

    <section class="glass-card" id="card">
      <span class="droplet-highlight"></span>
      <div class="caustics"></div>
      <div class="water-tint"></div>
      <span class="wave w1"></span>
      <span class="wave w2"></span>

      <div class="tiles">
        <button class="tile" aria-label="Airplane mode">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" transform="rotate(45 12 12)" />
          </svg>
        </button>

        <button class="tile" aria-label="Cellular data">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="15" width="4.2" height="7" rx="1.5" />
            <rect x="8.1" y="11" width="4.2" height="11" rx="1.5" />
            <rect x="14.2" y="6.5" width="4.2" height="15.5" rx="1.5" />
            <rect x="20.3" y="2" width="2.7" height="20" rx="1.35" fill="rgba(255,255,255,0.28)" />
          </svg>
        </button>

        <button class="tile" aria-label="Wi-Fi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M3.2 9.4a13.5 13.5 0 0 1 17.6 0" />
            <path d="M6.4 12.9a9.5 9.5 0 0 1 11.2 0" />
            <path d="M9.6 16.3a5.5 5.5 0 0 1 4.8 0" />
            <circle cx="12" cy="19.4" r="1.5" fill="currentColor" stroke="none" />
          </svg>
        </button>

        <button class="tile" aria-label="Bluetooth">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 7 10 10-5 5V2l5 5L7 17" />
          </svg>
        </button>
      </div>
    </section>

    <div class="promo">
      <h1>New, universal design.</h1>
      <p>Liquid Glass reflects and refracts what's beneath it in real time, dynamically adapting to your content across apps and devices.</p>
    </div>

    <div class="home-indicator"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
