name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (GPU-free)
        run: bun test src/providers/photon.test.ts

      - name: Build
        run: bun run build

      - name: Verify package contents
        run: |
          npm pack --dry-run
          test -f dist/plugin.js
          test -f dist/python/runtime.py

  lint-python:
    name: Lint Python runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Lint runtime.py
        run: python3 -m py_compile python/runtime.py